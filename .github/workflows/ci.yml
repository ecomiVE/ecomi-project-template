      #
      # - name: Lint
      #   run: ruff check .
      #
      # - name: Format check
      #   run: ruff format --check .
      #
      # - name: Types
      #   run: mypy src/
      #
      # - name: Tests
      #   run: pytest -q

      # --- Node ------------------------------------------------------------
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: pnpm
      #
      # - name: Install
      #   run: pnpm install --frozen-lockfile
      #
      # - name: Lint
      #   run: pnpm lint
      #
      # - name: Types
      #   run: pnpm typecheck
      #
      # - name: Tests
      #   run: pnpm test
      #
      # - name: Build
      #   run: pnpm build

      - name: Placeholder
        run: |
          echo "CI is not configured yet."
          echo "Uncomment the block for this project's stack in .github/workflows/ci.yml"
          exit 1

  # A committed secret must be rotated, not just reverted. This catches the
  # obvious cases before they reach a branch.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
