# -----------------------------------------------------------------------------
# CI — runs on every pull request and on pushes to the long-lived branches.
#
# During project setup: uncomment the block for this project's stack, delete
# the others, and confirm CI is green on an empty commit BEFORE the start date.
# A red pipeline on day one is a setup problem, not a code problem.
#
# These must be the same commands developers run locally (see README §2).
# -----------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [developing, production]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # --- Python ----------------------------------------------------------
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      #
